[package]
name = "dotscope-cli"
version = "0.9.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Command-line tool for .NET assembly analysis, inspection, and deobfuscation"

[[bin]]
name = "dotscope"
path = "src/main.rs"

[features]
default = []
smart-rename = ["dotscope/smart-rename"]

[dependencies]
dotscope = { path = "../dotscope", features = ["deobfuscation"] }
clap = { version = "4.6.7", features = ["derive", "env", "wrap_help"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
anyhow = "1.0.104"
comfy-table = "8.0.1"
widestring = "1.2.1"
ctrlc = "3.5.2"
env_logger = "0.11.11"
log = "0.4.35"
