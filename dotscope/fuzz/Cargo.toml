[package]
name = "dotscope-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Prevent cargo from treating this as part of the parent workspace.
# cargo-fuzz requires nightly and its own isolated build environment.
[workspace]

[dependencies]
libfuzzer-sys = "0.4.13"

# Each target calls its entry point in `dotscope::testkit::fuzz`, which the regression
# replay (`tests/fuzz_regressions.rs`) calls too.
[dependencies.dotscope]
path = ".."
features = ["testkit"]

[[bin]]
name = "assembly_identity"
path = "fuzz_targets/assembly_identity.rs"
test = false
doc = false
bench = false

